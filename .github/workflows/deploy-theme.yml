name: Deploy theme to Hostinger

on:
  push:
    branches: [main]
    paths:
      - "onlinepromax-wp-theme/**"
  workflow_dispatch:

concurrency:
  group: deploy-theme
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Upload theme over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./onlinepromax-wp-theme/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            blog-posts-source/**
            README-WORDPRESS-SETUP.md
            onlinepromax-content-import.xml
